name: Daily Tech Watch Automation

on:
  schedule:
    - cron: '14 4 * * *' # 04h14 UTC (05h14 Hiver / 06h14 Été FR)
    - cron: '14 5 * * *' # 05h14 UTC (06h14 Hiver FR)
  workflow_dispatch:

# Permission nécessaire pour permettre au keepalive de réinitialiser les 60 jours
permissions:
  contents: write

jobs:
  run-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py

      # Step Keepalive : Empêche GitHub de désactiver le cron au bout de 60 jours
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
