name: Daily Tech Watch Automation

on:
  schedule:
    # Double déclenchement Cron pour couvrir l'heure d'été (04h14 UTC) et d'hiver (05h14 UTC)
    - cron: '14 4 * * *'
    - cron: '14 5 * * *'
  workflow_dispatch: # Permet d'exécuter le script manuellement depuis l'onglet Actions

jobs:
  run-veille:
    runs-on: ubuntu-latest

    steps:
      - name: Check-out du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du script de veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py
